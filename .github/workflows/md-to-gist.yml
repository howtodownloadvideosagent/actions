name: Convert Markdown to Gists

on:
  workflow_dispatch:

jobs:
  process-markdown:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Process markdown files and create gists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          import os
          import json
          import requests
          from datetime import datetime
          
          github_token = os.environ['GITHUB_TOKEN']
          headers = {
              'Authorization': f'token {github_token}',
              'Accept': 'application/vnd.github.v3+json'
          }
          
          # Create done folder if it doesn't exist
          os.makedirs('done', exist_ok=True)
          
          gist_urls = []
          
          # Check if import folder exists
          if not os.path.exists('import'):
              print("No import folder found")
              exit(0)
          
          # Process each .md file in import folder
          for filename in os.listdir('import'):
              if filename.endswith('.md'):
                  filepath = os.path.join('import', filename)
                  print(f"Processing: {filepath}")
                  
                  # Read file content
                  with open(filepath, 'r', encoding='utf-8') as f:
                      content = f.read()
                  
                  # Create gist using GitHub API
                  gist_data = {
                      'description': filename,
                      'public': True,
                      'files': {
                          filename: {
                              'content': content
                          }
                      }
                  }
                  
                  response = requests.post(
                      'https://api.github.com/gists',
                      headers=headers,
                      json=gist_data
                  )
                  
                  if response.status_code == 201:
                      gist_url = response.json()['html_url']
                      print(f"Created gist: {gist_url}")
                      gist_urls.append(gist_url)
                      
                      # Move file to done folder
                      os.rename(filepath, os.path.join('done', filename))
                      print(f"Moved {filename} to done folder")
                  else:
                      print(f"Failed to create gist for {filename}")
                      print(f"Status: {response.status_code}")
                      print(f"Response: {response.text}")
          
          # Create gist list file
          if gist_urls:
              with open('gist_list.txt', 'w') as f:
                  f.write(f"# Gists Created on {datetime.now()}\n\n")
                  for url in gist_urls:
                      f.write(f"- {url}\n")
              
              print(f"Created gist_list.txt with {len(gist_urls)} gists")
          else:
              print("No gists created")
        shell: python

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add -A
          git status
          
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Process markdown files to gists [skip ci]"
            git push
            echo "Changes pushed successfully"
          else
            echo "No changes to commit"
          fi
